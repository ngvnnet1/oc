<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omnicons — Nhà & Nội thất</title>
  <style>
    :root {
      --navy: #060e1a;
      --navy2: #0a1628;
      --card: #0f1c2e;
      --card2: #132337;
      --gold: #d4af37;
      --gold2: #f0d77b;
      --gold3: #b8962e;
      --gold-deep: #b8901a;
      --gold-soft: rgba(212, 175, 55, 0.12);
      --text: #f5f0e6;
      --muted: #c4bdb3;
      --border: rgba(212, 175, 55, 0.2);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
      --max: 1280px;
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg,
          var(--navy) 0%,
          #0a1424 40%,
          #0c1828 100%);
      color: var(--text);
      font:
        15px/1.6 Inter,
        "Segoe UI",
        system-ui,
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: auto;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .gold {
      color: var(--gold);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 14, 26, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    .header-row {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
    }

    .brand img {
      height: 32px;
      width: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-item,
    .nav-button {
      position: relative;
      border: 0;
      background: none;
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      transition: 0.22s ease;
    }

    .nav-item::after,
    .nav-button::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 2px;
      height: 2px;
      background: linear-gradient(90deg,
          transparent,
          var(--gold),
          transparent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.22s ease;
    }

    .nav-item:hover,
    .nav-button:hover,
    .nav-item.active,
    .nav-button.active {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.06);
    }

    .nav-item:hover::after,
    .nav-button:hover::after,
    .nav-item.active::after,
    .nav-button.active::after {
      transform: scaleX(1);
    }

    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      background: rgba(10, 24, 38, 0.96);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .dropdown-menu button {
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      color: var(--muted);
      padding: 11px 12px;
      border-radius: 10px;
      transition: 0.2s ease;
    }

    .dropdown-menu button:hover {
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold);
      transform: translateX(2px);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--border);
      background: linear-gradient(180deg,
          rgba(18, 31, 48, 0.95),
          rgba(14, 23, 35, 0.9));
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 18px rgba(0, 0, 0, 0.18);
      transition: 0.22s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(212, 175, 55, 0.55);
      box-shadow: 0 12px 24px rgba(212, 175, 55, 0.12);
    }

    .btn-gold {
      border: 0;
      background: linear-gradient(135deg,
          var(--gold2),
          var(--gold),
          var(--gold3));
      color: var(--navy);
      box-shadow:
        0 14px 28px rgba(212, 175, 55, 0.28),
        inset 0 2px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-gold:hover {
      filter: brightness(1.03);
      transform: translateY(-1px) scale(1.01);
    }

    .menu-btn {
      display: none;
      border: 0;
      background: none;
      color: var(--text);
      font-size: 24px;
    }

    .mobile-nav {
      display: none;
      border-top: 1px solid var(--border);
      padding: 10px 16px 18px;
    }

    .mobile-nav.open {
      display: block;
    }

    .mobile-link,
    .mobile-group>button {
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      color: var(--text);
      padding: 12px 0;
      border-bottom: 1px solid #ffffff14;
    }

    .mobile-sub {
      padding-left: 16px;
    }

    .mobile-sub button {
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      color: var(--muted);
      padding: 9px 0;
    }

    .breadcrumb {
      position: sticky;
      top: 60px;
      z-index: 0;
      background: var(--card2);
      border-bottom: 1px solid #ffffff12;
    }

    .breadcrumb-row {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .breadcrumb button {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 0;
    }

    .breadcrumb .current {
      color: var(--gold);
      font-weight: 700;
    }

    main {
      min-height: calc(100vh - 64px);
    }

    section {
      padding: 56px 0;
    }

    .hero {
      padding: 105px 0;
      position: relative;
      overflow: hidden;
      min-height: 530px;
    }

    .hero-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 530px;
      overflow: hidden;
      z-index: 0;
      opacity: 0.7;
      background: #0a0a0a;
    }

    .hero-video-bg iframe {
      width: 100%;
      height: 100%;
      min-height: 530px;
      border: 0;
      pointer-events: none;
    }

    .hero .container {
      position: relative;
      z-index: 2;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      background: #0f1c2e33;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 68px);
      line-height: 0.98;
      margin: 0 0 18px;
      letter-spacing: -0.04em;
    }

    .hero p {
      font-size: 18px;
      max-width: 650px;
    }

    .hero-img {
      height: 500px;
      width: 100%;
      object-fit: cover;
      border-radius: 22px;
      box-shadow: 0 30px 70px #0006;
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
    }

    .card {
      background: linear-gradient(145deg, #0f1c2ee8, #0a1424f2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px #0006;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .card-body {
      padding: 18px;
    }

    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card:hover {
      border-color: #d4af3780;
      transform: translateY(-2px);
      box-shadow: 0 16px 45px #d4af3718;
    }

    .tag {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #0f1c2e99;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: var(--gold);
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 18px;
      padding: 16px;
      border-left: 2px solid var(--gold);
      background: #0f1c2e80;
      border-radius: 0 12px 12px 0;
    }

    .timeline-year {
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
    }

    .service {
      padding: 24px;
    }

    .service h3 {
      margin: 0 0 8px;
    }

    .process {
      counter-reset: step;
    }

    .process-item {
      position: relative;
      padding: 22px 22px 22px 70px;
    }

    .process-item:before {
      counter-increment: step;
      content: counter(step);
      position: absolute;
      left: 20px;
      top: 20px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: var(--navy);
      font-weight: 800;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .filter {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 15px;
    }

    .filter.active {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    .news-card .card-img {
      height: 190px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 30px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: #0a1424cc;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
    }

    .field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .office {
      padding: 18px;
    }

    .office strong {
      display: block;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .quote-panel {
      padding: 26px;
    }

    .range {
      width: 100%;
      accent-color: var(--gold);
    }

    .price {
      font-size: 40px;
      font-weight: 800;
      color: var(--gold);
    }

    .quote-page {
      padding: 40px 0 48px;
    }

    .quote-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.96fr);
      gap: 48px;
      align-items: start;
    }

    .quote-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0;
    }

    .quote-subtitle {
      font-size: 14px;
      color: #d4d0c9;
      margin: 10px 0 0;
    }

    .quote-controls {
      margin-top: 32px;
      padding: 24px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg,
          rgba(15, 28, 46, 0.9),
          rgba(12, 19, 30, 0.95));
      display: grid;
      gap: 24px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .quote-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .quote-range {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(90deg,
          rgba(212, 175, 55, 0.9) 0%,
          rgba(212, 175, 55, 0.7) 50%,
          rgba(255, 255, 255, 0.12) 50%,
          rgba(255, 255, 255, 0.12) 100%);
      height: 6px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    .quote-range::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: transparent;
    }

    .quote-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.96);
      background: radial-gradient(circle at 32% 30%,
          #fff9d8 0%,
          #f3df8d 22%,
          var(--gold) 38%,
          var(--gold-deep) 100%);
      box-shadow:
        0 0 0 6px rgba(212, 175, 55, 0.12),
        0 8px 18px rgba(0, 0, 0, 0.15);
      margin-top: -6px;
    }

    .quote-range::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: transparent;
    }

    .quote-range::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.96);
      background: radial-gradient(circle at 32% 30%,
          #fff9d8 0%,
          #f3df8d 22%,
          var(--gold) 38%,
          var(--gold-deep) 100%);
      box-shadow:
        0 0 0 6px rgba(212, 175, 55, 0.12),
        0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .quote-range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .floor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .floor-btn {
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(11, 18, 28, 0.9);
      color: var(--text);
      font-weight: 700;
      transition: 0.2s ease;
    }

    .floor-btn:hover {
      border-color: rgba(212, 175, 55, 0.8);
      box-shadow: 0 10px 18px rgba(212, 175, 55, 0.08);
    }

    .floor-btn.active {
      background: linear-gradient(135deg,
          var(--gold2),
          var(--gold),
          var(--gold3));
      border-color: var(--gold);
      color: var(--navy);
      box-shadow: 0 12px 28px rgba(212, 175, 55, 0.22);
    }

    .package-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .package-btn {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(11, 18, 28, 0.9);
      color: var(--text);
      padding: 12px;
      text-align: left;
      transition: 0.2s ease;
    }

    .package-btn:hover {
      border-color: rgba(212, 175, 55, 0.6);
      transform: translateY(-1px);
    }

    .package-btn.active {
      border-color: var(--gold);
      background: rgba(201, 162, 39, 0.08);
      box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.24);
    }

    .package-name {
      font-size: 13px;
      font-weight: 700;
    }

    .package-price {
      font-size: 11px;
      color: #d4d0c9;
      margin-top: 2px;
    }

    .quote-summary {
      position: sticky;
      top: 84px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #181818;
      color: #fff;
      padding: 28px;
    }

    .quote-kicker {
      font-size: 12px;
      letter-spacing: 0.14em;
      opacity: 0.6;
    }

    .quote-lines {
      margin-top: 16px;
      display: grid;
      gap: 16px;
      font-size: 14px;
    }

    .quote-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .quote-line span:first-child {
      opacity: 0.7;
    }

    .quote-vat {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .quote-total-box {
      margin-top: 24px;
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
    }

    .quote-total-label {
      font-size: 12px;
      color: #d4d0c9;
    }

    .quote-total {
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.15;
      margin-top: 4px;
    }

    .quote-total-vnd {
      font-size: 12px;
      color: #d4d0c9;
      margin-top: 4px;
    }

    .quote-pdf {
      margin-top: 16px;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 800;
    }

    .quote-note {
      font-size: 11px;
      color: #d4d0c9;
      margin: 10px 0 0;
      text-align: center;
    }

    .quote-guarantee {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }

    .quote-guarantee-icon {
      color: var(--gold);
      font-size: 20px;
      line-height: 1;
    }

    .quote-metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .quote-metric {
      border: 1px solid var(--border);
      background: var(--card2);
      border-radius: 10px;
      padding: 12px;
    }

    .quote-metric-label {
      font-size: 11px;
      color: #d4d0c9;
    }

    .quote-metric-value {
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }

    .home-quote-btn {
      margin-top: 40px;
      width: 100%;
      max-width: 300px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .hero-quote-btn {
      background: #0f1c2e;
      color: #a67c00;
      border: 0;
    }

    .hero-quote-btn:hover {
      background: #091323;
    }

    .hero-secondary-btn {
      border-color: rgba(255, 255, 255, 0.3);
      background: #09132378;
    }

    .hero-secondary-btn:hover {
      border-color: #fff;
    }

    .hero-standards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 48px;
    }

    .hero-standard {
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      padding-left: 16px;
    }

    .hero-standard small {
      display: block;
      font-size: 12px;
      opacity: 0.6;
    }

    .hero-standard strong {
      display: block;
      font-size: 18px;
      margin-top: 2px;
    }

    .hero-standard i {
      display: block;
      width: 32px;
      height: 2px;
      background: #0f1c2e;
      margin-top: 8px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #060e1ae8;
      display: grid;
      place-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-card {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #ffffff12;
    }

    .modal-head button {
      border: 0;
      background: none;
      color: var(--text);
      font-size: 22px;
    }

    .modal-img {
      width: 100%;
      object-fit: cover;
    }

    .modal-body {
      padding: 20px;
    }

    .footer {
      background: #040a12;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 28px;
      padding: 44px 0;
    }

    .footer h3 {
      font-size: 14px;
      margin: 0 0 12px;
    }

    .footer button {
      display: block;
      border: 0;
      background: none;
      color: var(--muted);
      padding: 4px 0;
      text-align: left;
    }

    .footer button:hover {
      color: var(--gold);
    }

    .footer-bottom {
      border-top: 1px solid #ffffff12;
      padding: 18px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .loading-placeholder {
      text-align: center;
      padding: 60px 20px;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212, 175, 55, 0.1);
      border-top: 3px solid var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .news-detail-content {
      padding: 20px 0;
    }

    .news-detail-content h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .news-detail-content .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .news-detail-content .news-body {
      max-width: 100%;
      line-height: 1.8;
    }

    .news-detail-content .news-body img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 16px 0;
    }

    .news-detail-content .news-body a {
      color: var(--gold);
      text-decoration: underline;
    }

    .news-detail-content .news-body ul,
    .news-detail-content .news-body ol {
      padding-left: 24px;
    }

    .news-detail-content .news-body h2,
    .news-detail-content .news-body h3,
    .news-detail-content .news-body h4 {
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .news-detail-content .news-body p {
      margin-bottom: 12px;
    }

    .news-iframe-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      margin: 16px 0;
    }

    .news-iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 1024px) {
      .nav {
        display: none;
      }

      .menu-btn {
        display: block;
      }

      .hero-grid,
      .contact-grid,
      .quote-grid {
        grid-template-columns: 1fr;
      }

      .hero-img {
        height: 360px;
      }

      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .quote-layout {
        grid-template-columns: 1fr;
      }

      .quote-summary {
        position: static;
      }

      .hero-standards {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 42px;
      }

      .grid-2,
      .grid-3,
      .grid-4,
      .stats {
        grid-template-columns: 1fr;
      }

      .section-head {
        display: block;
      }

      .section-head h2 {
        font-size: 28px;
      }

      .hero-img {
        height: 280px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

      .actions .btn {
        display: none;
      }

      .timeline-item {
        grid-template-columns: 70px 1fr;
      }

      .floor-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .package-grid {
        grid-template-columns: 1fr;
      }

      .quote-metric-grid {
        grid-template-columns: 1fr;
      }

      .hero-standards {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .quote-summary {
        padding: 20px;
      }

      .hero-video-bg iframe {
        min-height: 400px;
      }
    }

</head>

    function formatDate(dateStr) {
      if (!dateStr) return "12/05/2024";
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "12/05/2024";
        const day = String(d.getDate()).padStart(2, "0");
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      } catch {
        return "12/05/2024";
      }
    }

    function extractExcerpt(html, maxLength = 120) {
      if (!html) return "";
      // Strip HTML tags
      const text = html.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength) + "...";
    }

      let bodyHtml;
      if (hasUrl) {
        // Display as iframe when URL exists
        bodyHtml = `
          <div class="news-iframe-wrapper">
            <iframe 
              src="${esc(x.url)}" 
              allowfullscreen
              loading="lazy"
              referrerpolicy="no-referrer"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            ></iframe>
          </div>
        `;
      } else {
        // Use content HTML as before
        bodyHtml = x.content || "<p>Nội dung đang được cập nhật...</p>";

        // Enhanced: Convert internal links with data-go support
        bodyHtml = bodyHtml.replace(
          /<a\s+href="#([^"']+)"([^>]*)>/g,
          (match, anchor, rest) => {
            return `<a href="#${anchor}" data-anchor="${anchor}" ${rest} onclick="event.preventDefault(); document.querySelector('[name=\\'${anchor}\\']')?.scrollIntoView({ behavior: 'smooth' }); document.getElementById('${anchor}')?.scrollIntoView({ behavior: 'smooth' });">`;
          }
        );

        // Also handle image links that might have anchors
        bodyHtml = bodyHtml.replace(
          /<img([^>]*)>/g,
          (match, attrs) => {
            return `<img${attrs}>`;
          }
        );
      }

      return `
      <section>
        <div class="container news-detail-content" style="color: black; padding: 10px; background-color: white;">

    function updateAreaSliderStyle() {
      const slider = document.querySelector("[data-area]");
      if (!slider) return;
      const min = Number(slider.min || 40);
      const max = Number(slider.max || 300);
      const value = Number(slider.value || min);
      const percent = ((value - min) / (max - min)) * 100;
      slider.style.background = `linear-gradient(90deg, rgba(212,175,55,0.96) 0%, rgba(212,175,55,0.96) ${percent}%, rgba(255,255,255,0.12) ${percent}%, rgba(255,255,255,0.12) 100%)`;
    }

    function syncQuoteMetrics() {
      const slider = document.querySelector("[data-area]");
      if (!slider) return;

      const packages = {
        "Tiết kiệm": { key: "modern", price: 5500000, factor: 1 },
        Khá: { key: "classic", price: 6000000, factor: 1.15 },
        "Cao cấp": { key: "luxury", price: 7500000, factor: 1.35 },
      };
      const selected = packages[state.package] || packages["Khá"];
      const area = Number(state.area || slider.value || 40);
      const floors = Number(state.floors || 2);
      const totalArea = area * floors;
      const base = totalArea * 6000000;
      const raw = base * selected.factor;
      const vat = raw * 0.1;
      const total = raw + vat;
      const rough = raw * 0.55;
      const finish = raw * 0.35;
      const interior = raw * 0.1;
      const money = (n) => Math.round(n).toLocaleString("vi-VN") + "đ";

      const areaValue = document.querySelector("[data-area-value]");
      const totalAreaEl = document.querySelector("[data-total-area]");
      const unitPriceEl = document.querySelector("[data-unit-price]");
      const roughEl = document.querySelector("[data-rough]");
      const finishEl = document.querySelector("[data-finish]");
      const interiorEl = document.querySelector("[data-interior]");
      const vatEl = document.querySelector("[data-vat]");
      const totalAmountEl = document.querySelector("[data-total-amount]");
      const totalPriceEl = document.querySelector("[data-total-price]");

      if (areaValue) areaValue.textContent = `${area}m2`;
      if (totalAreaEl) totalAreaEl.textContent = `${totalArea} m2`;
      if (unitPriceEl)
        unitPriceEl.textContent = `${(selected.price / 1000000).toFixed(1)} tr/m2`;
      if (roughEl) roughEl.textContent = money(rough);
      if (finishEl) finishEl.textContent = money(finish);
      if (interiorEl) interiorEl.textContent = money(interior);
      if (vatEl) vatEl.textContent = money(vat);
      if (totalAmountEl)
        totalAmountEl.textContent = `${(total / 1e9).toFixed(2)} tỷ`;
      if (totalPriceEl)
        totalPriceEl.textContent = `${money(total)} VNĐ (đã VAT)`;
    }

    function bind() {
      document
        .querySelectorAll("[data-go]")
        .forEach((b) => (b.onclick = () => go(b.dataset.go)));

      document.querySelectorAll("[data-news]").forEach((el) => {
        el.onclick = (e) => {
          e.stopPropagation();
          const data = JSON.parse(el.dataset.news);
          go("news-detail", data);
        };
      });

      document.querySelectorAll("[data-modal]").forEach((el) => {
        el.onclick = (e) => {
          e.stopPropagation();
          state.modal = JSON.parse(el.dataset.modal);
          render();
        };
      });

      document.querySelectorAll("[data-drop]").forEach(
        (b) =>
        (b.onclick = () => {
          state.dropdown =
            state.dropdown === b.dataset.drop ? null : b.dataset.drop;
          render();
        }),
      );
      document
        .querySelector("[data-mobile]")
        ?.addEventListener("click", () => {
          state.mobile = !state.mobile;
          render();
        });
      document.querySelectorAll("[data-arch-filter]").forEach(
        (b) =>
        (b.onclick = () => {
          state.archFilter = b.dataset.archFilter;
          render();
        }),
      );
      document.querySelectorAll("[data-int-filter]").forEach(
        (b) =>
        (b.onclick = () => {
          state.interiorFilter = b.dataset.intFilter;
          render();
        }),
      );
      document.querySelectorAll("[data-package]").forEach(
        (b) =>
        (b.onclick = () => {
          state.package = b.dataset.package;
          render();
        }),
      );
      const areaSlider = document.querySelector("[data-area]");
      areaSlider?.addEventListener("input", (e) => {
        state.area = +e.target.value;
        updateAreaSliderStyle();
        syncQuoteMetrics();
      });
      updateAreaSliderStyle();
      syncQuoteMetrics();
      document.querySelectorAll("[data-floors]").forEach(
        (b) =>
        (b.onclick = () => {
          state.floors = +b.dataset.floors;
          render();
        }),
      );
      document.querySelectorAll("[data-close-modal]").forEach(
        (b) =>
        (b.onclick = (e) => {
          if (e.target === b || e.target.closest("[data-close-modal]")) {
            state.modal = null;
            render();
          }
        }),
      );
      // Handle anchor links in news content
      document.querySelectorAll('[data-anchor]').forEach(el => {
        el.onclick = function (e) {
          e.preventDefault();
          const anchor = this.dataset.anchor;
          // Try multiple ways to find the target element
          let target = document.getElementById(anchor);
          if (!target) {
            target = document.querySelector(`[name="${anchor}"]`);
          }
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Update URL hash without triggering navigation
            history.pushState(null, '', `#${anchor}`);
          }
        };
      });

      // Also handle regular hash links that might be in the content
      document.querySelectorAll('.news-body a[href^="#"]').forEach(el => {
        if (!el.dataset.anchor) {
          el.onclick = function (e) {
            e.preventDefault();
            const href = this.getAttribute('href');
            const anchor = href.substring(1);
            let target = document.getElementById(anchor);
            if (!target) {
              target = document.querySelector(`[name="${anchor}"]`);
            }
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.pushState(null, '', `#${anchor}`);
            }
          };
        }
      });
    }

    // Fetch architecture data from API
    async function fetchArchitectureData() {
      try {
        const response = await fetch(ARCHITECTURE_API_URL);
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          CONTENT.architecture = data.map((item) => ({
            id: item.id,
            name: item.details?.notes || item.name || "Mẫu thiết kế",
            type: item.details?.typeOfHouse || "Biệt thự",
            area: item.details?.area || 0,
            img: item.url || IMAGES[Math.floor(Math.random() * IMAGES.length)],
            owner: item.details?.owner || "Chủ đầu tư",
            address: item.details?.addresses || "Việt Nam",
            url: item.url,
            details: item.details,
          }));
        }
      } catch (error) {
        console.error("Failed to fetch architecture data:", error);
        CONTENT.architecture = Array.from({ length: 12 }, (_, i) => ({
          name: `Mẫu thiết kế #${i + 1}`,
          type: i % 2 === 0 ? "Biệt thự" : "Nhà phố",
          area: 200 + i * 30,
          img: IMAGES[i % IMAGES.length],
          owner: "Chủ đầu tư",
          address: "Hà Nội",
        }));
      }
    }

    // Fetch interior data from API
    async function fetchInteriorData() {
      try {
        const response = await fetch(INTERIOR_API_URL);
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          fetchedInterior = data.map((item) => ({
            id: item.id,
            name: item.name || "Mẫu nội thất",
            type: item.type || "image",
            url: item.url || interiorIMAGES[Math.floor(Math.random() * interiorIMAGES.length)],
            details: item.details || {},
          }));
        }
      } catch (error) {
        console.error("Failed to fetch interior data:", error);
        fetchedInterior = [];
      }
    }

    // Fetch news data from API
    async function fetchNewsData() {
      try {
        const response = await fetch(NEWS_API_URL);
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          fetchedNews = data.map((item) => ({
            title: item.title || "Bài viết mới",
            content: item.content || "",
            url: item.url || "", // Preserve URL for iframe embedding
            date: item.date || new Date().toString(),
            excerpt: extractExcerpt(item.content, 120),
            image: (() => {
              if (!item.content) return null;
              const imgMatch = item.content.match(/<img[^>]+src="([^"]+)"/);
              return imgMatch ? imgMatch[1] : null;
            })(),
          }));
          CONTENT.news = fetchedNews;
        }
      } catch (error) {
        console.error("Failed to fetch news data:", error);
      }
    }

    // Initialize - fetch all data sources
    // async function init() {
    function init() {
      // await Promise.all([
      Promise.all([
        fetchArchitectureData(),
        fetchInteriorData(),
        fetchNewsData()
      ]);
      state.isLoading = false;
      render();
    }

    init();
  </script>
</body>

</html>
